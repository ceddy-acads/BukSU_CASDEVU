name: Deploy to InfinityFree

# Runs on every merge to main. Nothing else.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A pushed schema change would go live before the SQL runs, and the site
      # would 500. database/ is imported through phpMyAdmin, never over FTP.
      - name: Stop if this push changes database/
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^database/'; then
            echo "::error::This push touches database/. Run the SQL in phpMyAdmin first, then re-run this workflow."
            exit 1
          fi

      # Same list as README "Deploying to a live server": no .git, no docs,
      # no screenshots, no bin/, and no student uploads from storage/.
      - name: Build upload folder
        run: |
          git archive -o dist.tar HEAD .htaccess public includes storage
          mkdir dist
          tar -xf dist.tar -C dist
          rm dist.tar

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /htdocs/
          # Must stay false. true deletes config.local.php and every uploaded
          # student document in storage/uploads.
          dangerous-clean-slate: false
